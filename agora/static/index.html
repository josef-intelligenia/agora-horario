<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Horario AGORA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<!--PWA-->
<style>
  /* Neutros con sesgo verde-azulado (agua) y un acento teal que no compite
     con los colores vivos que la propia AGORA asigna a cada actividad. */
  :root{
    --bg:#F1F4F3; --panel:#FFFFFF; --panel-2:#F7F9F9; --linea:#DBE3E2;
    --texto:#0F1C1B; --suave:#4C5B5A; --tenue:#7C8B8A;
    --acento:#0E7C7B; --acento-suave:#DDF0EF;
    --sombra:0 1px 2px rgba(12,32,31,.06), 0 8px 24px rgba(12,32,31,.07);
    --radio:12px;
    --display:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    --cuerpo:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --cifras:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  /* Oscuro por herencia: lo que diga el sistema (documento sin marcar) o el
     visor de Claude, que estampa data-theme. Ambas se desactivan en cuanto hay
     un data-tema propio, de modo que la eleccion explicita de quien mira nunca
     compite con ellas y no depende de la especificidad. */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]):not([data-tema]){
      --bg:#0C1413; --panel:#131E1D; --panel-2:#182524; --linea:#263635;
      --texto:#E4EDEC; --suave:#9DB0AE; --tenue:#6B807E;
      --acento:#4FC3BE; --acento-suave:#12312F;
      --sombra:0 1px 2px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]:not([data-tema]){
    --bg:#0C1413; --panel:#131E1D; --panel-2:#182524; --linea:#263635;
    --texto:#E4EDEC; --suave:#9DB0AE; --tenue:#6B807E;
    --acento:#4FC3BE; --acento-suave:#12312F;
    --sombra:0 1px 2px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.35);
  }
  /* Eleccion explicita. "claro" no necesita reglas: basta con que ninguna de
     las anteriores aplique y quede la paleta base de :root. */
  :root[data-tema="oscuro"]{
    --bg:#0C1413; --panel:#131E1D; --panel-2:#182524; --linea:#263635;
    --texto:#E4EDEC; --suave:#9DB0AE; --tenue:#6B807E;
    --acento:#4FC3BE; --acento-suave:#12312F;
    --sombra:0 1px 2px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.35);
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important}
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--texto);
    font:400 15px/1.5 var(--cuerpo);
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--acento)}
  .contenedor{max-width:1180px;margin:0 auto;padding:0 20px}

  /* ---------- cabecera ---------- */
  header{
    position:sticky; top:0; z-index:30; background:var(--panel);
    border-bottom:1px solid var(--linea);
  }
  .barra{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 0}
  .marca{display:flex;align-items:baseline;gap:10px;margin-right:auto}
  .marca h1{font:700 22px/1 var(--display);margin:0;text-transform:uppercase;letter-spacing:.045em}
  .marca span{font-size:12px;color:var(--tenue);letter-spacing:.01em}
  .nav-fecha{display:flex;align-items:center;gap:6px}
  button,select,input{font:inherit;color:inherit}
  .btn{
    background:var(--panel-2); border:1px solid var(--linea); color:var(--texto);
    border-radius:9px; padding:7px 12px; cursor:pointer; white-space:nowrap;
    transition:background .12s,border-color .12s;
  }
  .btn:hover{background:var(--acento-suave);border-color:var(--acento)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.principal{background:var(--acento);border-color:var(--acento);color:#fff}
  .btn.principal:hover{filter:brightness(1.08)}
  .btn.icono{padding:7px 10px;font-variant-numeric:tabular-nums}
  input[type=date],input[type=search],input[type=time],select{
    background:var(--panel-2); border:1px solid var(--linea);
    border-radius:9px; padding:7px 10px;
  }
  input:focus,select:focus,button:focus-visible{
    outline:2px solid var(--acento); outline-offset:1px;
  }

  /* ---------- filtros ---------- */
  .filtros{
    display:grid; gap:10px; padding:0 0 14px;
    grid-template-columns:minmax(200px,1.6fr) repeat(3,minmax(130px,1fr)) auto;
  }
  @media (max-width:860px){ .filtros{grid-template-columns:1fr 1fr} }
  .horas{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--suave)}
  .horas input{width:100%;min-width:0}
  .conmutador{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--suave);cursor:pointer;white-space:nowrap}

  /* ---------- filtro de seleccion multiple ---------- */
  .multi{position:relative;min-width:0}
  .multi > .disparador{
    width:100%; display:flex; align-items:center; gap:8px; text-align:left;
    padding:7px 10px; overflow:hidden;
  }
  .multi > .disparador .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .multi > .disparador .flecha{margin-left:auto;color:var(--tenue);font-size:10px}
  .multi.activo > .disparador{border-color:var(--acento);background:var(--acento-suave)}
  .multi .panel{
    position:absolute; top:calc(100% + 6px); left:0; z-index:60;
    min-width:min(280px,90vw); max-width:340px; max-height:330px; overflow:auto;
    background:var(--panel); border:1px solid var(--linea); border-radius:11px;
    box-shadow:var(--sombra); padding:8px; display:none;
  }
  .multi.abierto .panel{display:block}
  .multi .panel .buscador{width:100%;margin-bottom:6px}
  .multi .opcion{
    display:flex; align-items:center; gap:9px; padding:6px 8px; border-radius:8px;
    cursor:pointer; font-size:13.5px; line-height:1.3;
  }
  .multi .opcion:hover{background:var(--acento-suave)}
  .multi .opcion input{accent-color:var(--acento);flex:0 0 auto}
  .multi .opcion .n{
    margin-left:auto; color:var(--tenue); font-size:11.5px;
    font-family:var(--cifras); font-variant-numeric:tabular-nums;
  }
  .multi .vacio{padding:10px 8px;color:var(--tenue);font-size:13px}

  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 12px}
  .chips:empty{display:none}

  /* ---------- panel de filtros plegable ---------- */
  .alternar{display:none}                 /* solo hace falta cuando puede plegarse */
  #tema{padding:6px 11px;font-size:18px;line-height:1.15}
  .insignia{
    display:inline-grid; place-items:center; min-width:18px; height:18px;
    margin-left:7px; padding:0 5px; border-radius:9px;
    background:var(--acento); color:#fff;
    font:600 11px/1 var(--cifras); font-variant-numeric:tabular-nums;
  }
  .insignia[hidden]{display:none}   /* si no, el display de arriba gana al atributo */
  .alternar[aria-expanded="true"]{border-color:var(--acento);background:var(--acento-suave)}
  #panel-filtros[hidden]{display:none}
  @media (min-width:721px){ #panel-filtros[hidden]{display:block} }

  /* ---------- dias ---------- */
  .dias{display:flex;gap:8px;overflow-x:auto;padding:0 0 14px;scrollbar-width:thin}
  .dia-chip{
    flex:0 0 auto; border:1px solid var(--linea); background:var(--panel);
    border-radius:11px; padding:8px 13px; cursor:pointer; text-align:left; line-height:1.25;
  }
  .dia-chip.activo{border-color:var(--acento); background:var(--acento-suave)}
  .dia-chip .dow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--tenue)}
  .dia-chip .num{font:600 16px/1.2 var(--cifras);font-variant-numeric:tabular-nums}
  .dia-chip .cnt{font-size:11px;color:var(--tenue)}
  .dia-chip.hoy .num{color:var(--acento)}

  /* ---------- lista ---------- */
  /* main.contenedor y no main: .contenedor ya fija el padding y, siendo clase,
     le gana a un selector de elemento. */
  main.contenedor{padding-top:22px;padding-bottom:60px}
  .grupo{margin-bottom:26px}
  .grupo h2{
    font:600 13px/1.2 var(--display); text-transform:uppercase; letter-spacing:.12em; color:var(--tenue);
    margin:0 0 10px; padding:6px 0 8px; border-bottom:1px solid var(--linea);
    /* Se queda justo debajo de la cabecera, que es pegajosa y de altura
       variable; el alto lo publica el guion en --alto-cabecera. Con fondo
       propio y por debajo de ella en z-index, para no transparentarse ni
       taparla. */
    position:sticky; top:var(--alto-cabecera,0px); z-index:20; background:var(--bg);
  }
  .tarjetas{display:grid;gap:8px}
  .clase{
    display:grid; grid-template-columns:78px 8px 1fr auto; gap:14px; align-items:center;
    background:var(--panel); border:1px solid var(--linea); border-radius:var(--radio);
    padding:11px 14px; cursor:pointer; text-align:left; width:100%;
    transition:transform .1s, box-shadow .12s, border-color .12s;
  }
  .clase:hover{box-shadow:var(--sombra); border-color:var(--acento); transform:translateY(-1px)}
  .clase.pasada{opacity:.48}
  .hora{font:500 15px/1.2 var(--cifras);font-variant-numeric:tabular-nums}
  .hora small{display:block;font-weight:500;font-size:11.5px;color:var(--tenue);margin-top:2px}
  .cinta{width:8px;height:38px;border-radius:5px}
  .nombre{font:600 18px/1.15 var(--display);letter-spacing:.02em}
  .meta{font-size:12.5px;color:var(--suave);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
  .meta em{font-style:normal;color:var(--tenue)}
  .lado{text-align:right;font-size:12px;color:var(--tenue);white-space:nowrap}
  .compacto{display:none}   /* duracion y plazas dentro de la meta, solo en movil */
  .lado b{display:block;font:500 13px/1.3 var(--cifras);color:var(--suave);font-variant-numeric:tabular-nums}

  .aviso{
    background:var(--panel); border:1px solid var(--linea); border-radius:var(--radio);
    padding:28px; text-align:center; color:var(--suave);
  }
  .aviso.error{border-color:#d1495b;color:#d1495b}
  .cargando{color:var(--tenue);font-size:13px}

  /* ---------- panel de detalle ---------- */
  .velo{
    position:fixed; inset:0; background:rgba(9,12,17,.5); z-index:40;
    opacity:0; pointer-events:none; transition:opacity .16s;
  }
  .velo.abierto{opacity:1;pointer-events:auto}
  .cajon{
    position:fixed; top:0; right:0; bottom:0; width:min(460px,100%); z-index:50;
    background:var(--panel); border-left:1px solid var(--linea);
    transform:translateX(100%); transition:transform .2s ease;
    display:flex; flex-direction:column;
  }
  .cajon.abierto{transform:none}
  .cajon-cab{padding:18px 20px;border-bottom:1px solid var(--linea)}
  .cajon-cab .cerrar{float:right;background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--tenue)}
  .cajon-cab h3{margin:0 0 5px;font:700 26px/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em}
  .cajon-cab p{margin:0;color:var(--suave);font-size:13px}
  .cajon-cuerpo{padding:18px 20px;overflow:auto;flex:1}
  .descripcion{background:var(--panel-2);border:1px solid var(--linea);border-radius:10px;padding:13px;font-size:14px;color:var(--suave);margin-bottom:18px}
  dl.campos{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;margin:0;font-size:13px}
  dl.campos dt{color:var(--tenue)}
  dl.campos dd{margin:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
  details.crudo{margin-top:18px;font-size:12.5px}
  details.crudo summary{cursor:pointer;color:var(--suave)}
  details.crudo pre{
    background:var(--panel-2); border:1px solid var(--linea); border-radius:9px;
    padding:11px; overflow:auto; max-height:320px; font-size:11.5px; margin-top:9px;
  }
  .cajon-pie{padding:14px 20px;border-top:1px solid var(--linea);display:flex;gap:8px}
  footer{color:var(--tenue);font-size:12px;padding:0 0 30px;text-align:center}

  /* ---------- pantallas estrechas ----------
     La cabecera es pegajosa: cada fila que crece se come la pantalla. Aqui se
     pliegan los filtros, la barra se reduce a dos filas exactas y la tarjeta
     pasa de tres columnas a dos lineas. Va al final a proposito: sobreescribe
     reglas declaradas mas arriba con la misma especificidad. */
  @media (max-width:720px){
    .contenedor{padding:0 14px}
    .alternar{display:inline-flex;align-items:center}

    .barra{padding:10px 0;gap:8px}
    /* Salto de linea forzado: todo lo de order 1 arriba, lo de order 3 abajo. */
    .barra::after{content:"";flex-basis:100%;order:2;height:0}
    .marca,#ics,#tema,#alternar-filtros{order:1}
    .nav-fecha{order:3}
    /* Exportar se queda arriba, pero solo como icono: la fila de fechas ya va justa. */
    #ics .rotulo{display:none}
    #ics::after{content:"\2193";font-size:16px;line-height:1}
    .marca{margin-right:auto}
    .marca h1{font-size:19px}
    .marca span{display:none}
    .nav-fecha{flex:1 1 auto;min-width:0;gap:5px}
    /* La fecha necesita entera "dd/mm/aaaa"; lo que sobra sale del resto. */
    .nav-fecha input[type=date]{flex:1 1 auto;min-width:112px;width:auto}
    .nav-fecha select{padding:7px 2px;font-size:13px}
    .nav-fecha .icono{padding:7px 9px}
    #refrescar{display:none}               /* recargar es cosa de escritorio */

    /* Desplegable flotante: abierto no debe engordar la cabecera pegajosa,
       asi que se sale del flujo y se superpone a la lista. */
    #panel-filtros{
      position:absolute; top:100%; left:0; right:0; z-index:25;
      padding:12px 14px 4px; background:var(--panel);
      border-bottom:1px solid var(--linea); box-shadow:var(--sombra);
    }
    .filtros{grid-template-columns:1fr;gap:8px;padding-bottom:10px}
    .filtros:last-of-type{grid-template-columns:auto 1fr;align-items:center}
    .dias{padding-bottom:10px;gap:6px}
    .dia-chip{padding:6px 11px}

    .clase{grid-template-columns:56px 6px 1fr;gap:11px;padding:10px 12px}
    .lado{display:none}                    /* su contenido pasa a la meta */
    .compacto{display:inline}
    .cajon{width:100%}
  }
</style>
</head>

<script>
  // Antes de que se pinte nada, para que no haya un parpadeo de tema.
  try {
    var t = localStorage.getItem("agora:tema");
    if (t) document.documentElement.setAttribute("data-tema", t);
  } catch (e) {}
</script>

<header>

        <select id="dias" title="Dias a mostrar">
          <option value="1">1 dia</option>

      <button class="btn principal" id="ics" title="Descargar los resultados filtrados en .ics">
        <span class="rotulo">Exportar</span></button>

      <input type="search" id="q" placeholder="Buscar actividad, monitor, sala o descripcion…  ( / )">

      <div class="multi" id="f-sala"></div>
      <div class="multi" id="f-monitor"></div>
      <div class="horas">
        <input type="time" id="h1" title="Desde"><span>–</span><input type="time" id="h2" title="Hasta">
      </div>
    </div>

    <div class="dias" id="dias-chips"></div>
  </div>
</header>

<main class="contenedor" id="lista"></main>
<footer class="contenedor">

</footer>

<script>
const DOW = ["dom","lun","mar","mie","jue","vie","sab"];
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[m]));

// Dos modos con la misma interfaz:
//  - servidor : la app local consulta AGORA en vivo a traves de /api
//  - instantanea : pagina autocontenida, los datos vienen incrustados
const FUENTE = window.AGORA_DATOS || null;

// Preferencias de quien mira, en su propio navegador. Puede fallar (ventana
// privada, cookies bloqueadas), asi que nunca debe romper la pagina.
const recordar = {
  leer(clave) { try { return localStorage.getItem("agora:" + clave); } catch (e) { return null; } },
  guardar(clave, valor) { try { localStorage.setItem("agora:" + clave, valor); } catch (e) {} },
};

let clases = [], catalogo = null, diaActivo = null, peticion = 0;

const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const hoyISO = () => iso(new Date());
const plano = s => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const minutos = hhmm => { const [h, m] = String(hhmm).split(":"); return (+h) * 60 + (+m || 0); };

/* ------------------------- filtro de seleccion multiple --------------------- */

function crearMulti(id, etiqueta, singular, plural) {
  const raiz = document.getElementById(id);
  raiz.innerHTML =
    `<button type="button" class="btn disparador" aria-haspopup="listbox" aria-expanded="false">
       <span class="txt"></span><span class="flecha">&#9660;</span>
     </button>
     <div class="panel" role="listbox">
       <input type="search" class="buscador" placeholder="Filtrar ${plural}…">
       <div class="opciones"></div>
     </div>`;

  const boton = raiz.querySelector(".disparador");
  const texto = raiz.querySelector(".txt");
  const buscador = raiz.querySelector(".buscador");
  const lista = raiz.querySelector(".opciones");
  let opciones = [], elegidos = new Set(), alCambiar = () => {};

  const rotular = () => {
    const n = elegidos.size;
    texto.textContent = n === 0 ? etiqueta
      : n === 1 ? [...elegidos][0]
      : `${n} ${plural}`;
    raiz.classList.toggle("activo", n > 0);
  };

  function pintarOpciones() {
    const q = plano(buscador.value);
    const visibles = opciones.filter(o => !q || plano(o.nombre).includes(q));
    lista.innerHTML = visibles.length
      ? visibles.map(o => `<label class="opcion">
           <input type="checkbox" value="${esc(o.nombre)}"${elegidos.has(o.nombre) ? " checked" : ""}>
           <span>${esc(o.nombre)}</span><span class="n">${o.clases}</span>
         </label>`).join("")
      : `<div class="vacio">Sin coincidencias</div>`;
    lista.querySelectorAll("input").forEach(i => i.onchange = () => {
      i.checked ? elegidos.add(i.value) : elegidos.delete(i.value);
      rotular(); alCambiar();
    });
  }

  const abrir = () => {
    document.querySelectorAll(".multi.abierto").forEach(m => m !== raiz && cerrarMulti(m));
    raiz.classList.add("abierto"); boton.setAttribute("aria-expanded", "true");
    buscador.value = ""; pintarOpciones(); buscador.focus();
  };
  boton.onclick = () => raiz.classList.contains("abierto") ? cerrarMulti(raiz) : abrir();
  buscador.oninput = pintarOpciones;

  const api = {
    raiz,
    valores: () => [...elegidos],
    opciones(nuevas) {
      opciones = nuevas;
      // Si una opcion elegida desaparece del catalogo, deja de filtrar por ella.
      const validas = new Set(nuevas.map(o => o.nombre));
      for (const v of elegidos) if (!validas.has(v)) elegidos.delete(v);
      rotular();
      if (raiz.classList.contains("abierto")) pintarOpciones();
    },
    quitar(valor) { elegidos.delete(valor); rotular(); if (raiz.classList.contains("abierto")) pintarOpciones(); },
    limpiar() { elegidos.clear(); rotular(); if (raiz.classList.contains("abierto")) pintarOpciones(); },
    alCambiar(fn) { alCambiar = fn; },
    etiqueta: singular,
  };
  rotular();
  return api;
}

function cerrarMulti(raiz) {
  raiz.classList.remove("abierto");
  raiz.querySelector(".disparador").setAttribute("aria-expanded", "false");
}

const MULTIS = {
  actividad: crearMulti("f-actividad", "Toda actividad", "actividad", "actividades"),
  sala:      crearMulti("f-sala",      "Toda sala",      "sala",      "salas"),
  monitor:   crearMulti("f-monitor",   "Todo monitor",   "monitor",   "monitores"),
};

document.addEventListener("click", e => {
  if (!e.target.closest(".multi")) document.querySelectorAll(".multi.abierto").forEach(cerrarMulti);
});

function pintarChips() {
  const trozos = [];
  for (const [clave, m] of Object.entries(MULTIS))
    for (const v of m.valores())
      trozos.push(`<span class="chip">${esc(v)}
        <button class="quitar" data-clave="${clave}" data-valor="${esc(v)}" title="Quitar">&times;</button></span>`);
  const cont = $("#chips");
  cont.innerHTML = trozos.join("");
  marcarInsignia();
  cont.querySelectorAll(".quitar").forEach(b => b.onclick = () => {
    MULTIS[b.dataset.clave].quitar(b.dataset.valor); pintarChips(); cargar();
  });
}

function estadoFiltros() {
  return {
    desde: $("#desde").value || hoyISO(),
    dias: Number($("#dias").value),
    q: $("#q").value.trim(),
    actividad: MULTIS.actividad.valores(),
    sala: MULTIS.sala.valores(),
    monitor: MULTIS.monitor.valores(),
    h1: $("#h1").value,
    h2: $("#h2").value,
    proximas: $("#proximas").checked,
  };
}

function params(extra = {}) {
  const f = estadoFiltros();
  const p = new URLSearchParams({ desde: f.desde, dias: f.dias });
  if (f.q) p.set("q", f.q);
  // Un valor por aparicion: actividad=X&actividad=Y (el servidor los une con OR).
  for (const v of f.actividad) p.append("actividad", v);
  for (const v of f.sala) p.append("sala", v);
  for (const v of f.monitor) p.append("monitor", v);
  if (f.h1) p.set("desde_hora", f.h1);
  if (f.h2) p.set("hasta_hora", f.h2);
  if (f.proximas) p.set("proximas", "1");
  for (const [k, v] of Object.entries(extra)) p.set(k, v);
  return p;
}

/* ------------------------------ carga de datos ------------------------------ */

function filtrarLocal() {
  const f = estadoFiltros();
  const inicio = f.desde, fin = iso(new Date(new Date(f.desde + "T00:00:00").getTime() + f.dias * 864e5));
  const ahora = new Date();
  const nq = plano(f.q);
  const na = f.actividad.map(plano), ns = f.sala.map(plano), nm = f.monitor.map(plano);
  // Sin valores no filtra; con varios basta con que encaje uno.
  const encaja = (campo, patrones) => !patrones.length || patrones.some(x => plano(campo).includes(x));
  const min1 = f.h1 ? minutos(f.h1) : null, min2 = f.h2 ? minutos(f.h2) : null;

  const ventana = FUENTE.clases.filter(c => c.fecha >= inicio && c.fecha < fin);
  const filtradas = ventana.filter(c => {
    if (!encaja(c.nombre, na)) return false;
    if (!encaja(c.sala, ns)) return false;
    if (!encaja(c.monitor, nm)) return false;
    if (nq && !plano(`${c.nombre} ${c.monitor} ${c.sala} ${c.descripcion}`).includes(nq)) return false;
    const m = minutos(c.hora);
    if (min1 !== null && m < min1) return false;
    if (min2 !== null && m > min2) return false;
    if (f.proximas && new Date(c.fin_utc || c.fin) < ahora) return false;
    return true;
  });
  return { ventana, filtradas };
}

async function cargar(refrescar = false) {
  if (FUENTE) {
    const { ventana, filtradas } = filtrarLocal();
    clases = filtradas; catalogo = FUENTE.catalogo;
    marcarEstado(filtradas.length, ventana.length);
    poblarFiltros(); pintarDias(); pintar();
    return;
  }
  const mio = ++peticion;
  $("#estado").textContent = refrescar ? "Descargando de AGORA…" : "Cargando…";
  try {
    const r = await fetch("/api/clases?" + params(refrescar ? { refrescar: 1 } : {}));
    const datos = await r.json();
    if (mio !== peticion) return;                     // llego tarde, ya hay otra busqueda
    if (!r.ok) throw new Error(datos.error || r.statusText);
    clases = datos.clases; catalogo = datos.catalogo;
    marcarEstado(datos.total, datos.total_ventana);
    poblarFiltros(); pintarDias(); pintar();
  } catch (e) {
    if (mio !== peticion) return;
    $("#estado").textContent = "";
    $("#lista").innerHTML = `<div class="aviso error">No se pudieron cargar los datos.<br><small>${esc(e.message)}</small></div>`;
  }
}

const marcarEstado = (n, total) =>
  $("#estado").textContent = n === total ? `${n} clases` : `${n} de ${total} clases`;

function poblarFiltros() {
  // El catalogo se calcula sobre la ventana completa, asi que las opciones no
  // cambian al filtrar y la seleccion se mantiene entre busquedas.
  MULTIS.actividad.opciones(catalogo.actividades);
  MULTIS.sala.opciones(catalogo.salas);
  MULTIS.monitor.opciones(catalogo.monitores);
  pintarChips();
}

/* -------------------------------- pintado ---------------------------------- */

function agrupar() {
  const grupos = new Map();
  for (const c of clases) {
    if (!grupos.has(c.fecha)) grupos.set(c.fecha, []);
    grupos.get(c.fecha).push(c);
  }
  return grupos;
}

function pintarDias() {
  const grupos = agrupar(), cont = $("#dias-chips");
  if (diaActivo && !grupos.has(diaActivo)) diaActivo = null;
  const chips = [`<button class="dia-chip ${diaActivo ? "" : "activo"}" data-dia="">
      <div class="dow">Todo</div><div class="num">${grupos.size}d</div><div class="cnt">${clases.length} clases</div></button>`];
  for (const [fecha, lista] of grupos) {
    const d = new Date(fecha + "T00:00:00");
    chips.push(`<button class="dia-chip ${diaActivo === fecha ? "activo" : ""} ${fecha === hoyISO() ? "hoy" : ""}" data-dia="${fecha}">
      <div class="dow">${DOW[d.getDay()]}</div><div class="num">${d.getDate()}</div><div class="cnt">${lista.length}</div></button>`);
  }
  cont.innerHTML = chips.join("");
  cont.querySelectorAll(".dia-chip").forEach(b =>
    b.onclick = () => { diaActivo = b.dataset.dia || null; pintarDias(); pintar(); });
}

function tarjeta(c, ahora) {
  const pasada = new Date(c.fin_utc || c.fin) < ahora;
  return `<button class="clase ${pasada ? "pasada" : ""}" data-id="${c.id}">
    <div class="hora">${c.hora}<small>${c.hora_fin}</small></div>
    <div class="cinta" style="background:${esc(c.color)}"></div>
    <div>
      <div class="nombre">${esc(c.nombre)}</div>
      <div class="meta"><span>${esc(c.sala)}</span><em>·</em><span>${esc(c.monitor)}</span>
        <em class="compacto">·</em><span class="compacto">${c.duracion_min} min</span></div>
    </div>
    <div class="lado"><b>${c.duracion_min} min</b>${c.capacidad ? c.capacidad + " plazas" : ""}</div>
  </button>`;
}

function pintar() {
  const grupos = agrupar(), ahora = new Date(), fuera = [];
  for (const [fecha, lista] of grupos) {
    if (diaActivo && fecha !== diaActivo) continue;
    const d = new Date(fecha + "T00:00:00");
    const titulo = `${DOW[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}` +
      (fecha === hoyISO() ? " · hoy" : "");
    fuera.push(`<section class="grupo"><h2>${titulo} — ${lista.length} clases</h2><div class="tarjetas">` +
      lista.map(c => tarjeta(c, ahora)).join("") + `</div></section>`);
  }
  $("#lista").innerHTML = fuera.length
    ? fuera.join("")
    : `<div class="aviso">Ninguna clase cumple estos filtros.</div>`;
  $("#lista").querySelectorAll(".clase").forEach(el =>
    el.onclick = () => abrir(clases.find(c => String(c.id) === el.dataset.id)));
}

/* ------------------------------ panel lateral ------------------------------- */

function abrir(c) {
  if (!c) return;
  const d = new Date(c.inicio);
  $("#d-nombre").textContent = c.nombre;
  $("#d-cuando").textContent =
    `${DOW[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]} · ${c.hora}–${c.hora_fin}`;
  $("#d-descripcion").hidden = !c.descripcion;
  $("#d-descripcion").textContent = c.descripcion || "";
  const campos = {
    "Sala": c.sala, "Monitor": c.monitor,
    "Duracion": c.duracion_min + " min",
    "Capacidad": c.capacidad ? c.capacidad + " plazas" : "sin definir",
    "Reservas publicadas": c.reservas + (c.reservas === 0 ? " (AGORA no las publica sin login)" : ""),
    "Lista de espera": c.lista_espera ? "si" : "no",
    "ID clase": c.id, "ID actividad": c.actividad_id, "ID sala": c.sala_id,
  };
  $("#d-campos").innerHTML = Object.entries(campos)
    .map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
  const crudo = $("#d-crudo").closest("details");
  if (c.crudo) { crudo.hidden = false; $("#d-crudo").textContent = JSON.stringify(c.crudo, null, 2); }
  else crudo.hidden = true;
  $("#d-ics").onclick = () => exportarICS([c], `agora-${plano(c.nombre).replace(/\W+/g, "-")}.ics`);
  $("#cajon").classList.add("abierto"); $("#cajon").setAttribute("aria-hidden", "false");
  $("#velo").classList.add("abierto");
}

function cerrar() {
  $("#cajon").classList.remove("abierto"); $("#cajon").setAttribute("aria-hidden", "true");
  $("#velo").classList.remove("abierto");
}

/* --------------------------------- iCalendar -------------------------------- */

const escICS = t => String(t ?? "").replace(/\\/g, "\\\\").replace(/;/g, "\\;")
  .replace(/,/g, "\\,").replace(/\n/g, "\\n");
const selloICS = iso => String(iso).replace(/[-:]/g, "").replace(/\.\d+Z?$/, "Z");

function construirICS(lista) {
  const ahora = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+Z$/, "Z");
  const l = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//agora-horario//ES", "CALSCALE:GREGORIAN",
             "METHOD:PUBLISH", "X-WR-CALNAME:AGORA - Actividades colectivas", "X-WR-TIMEZONE:Europe/Madrid"];
  for (const c of lista) {
    l.push("BEGIN:VEVENT", `UID:agora-${c.id}@agoragranada.provis.es`, `DTSTAMP:${ahora}`,
      `DTSTART:${selloICS(c.inicio_utc)}`, `DTEND:${selloICS(c.fin_utc)}`,
      `SUMMARY:${escICS(c.nombre)}`, `LOCATION:${escICS(c.sala)} - AGORA We Granada`,
      `DESCRIPTION:${escICS(c.descripcion || "")}`, `X-AGORA-MONITOR:${escICS(c.monitor)}`, "END:VEVENT");
  }
  l.push("END:VCALENDAR");
  return l.join("\r\n") + "\r\n";
}

async function exportarICS(lista, nombre = "agora-clases.ics") {
  if (!FUENTE) {                                  // con servidor, lo genera Python
    location.href = "/api/ics?" + (lista.length === 1
      ? new URLSearchParams({ desde: lista[0].fecha, dias: 1, q: lista[0].nombre,
                              desde_hora: lista[0].hora, hasta_hora: lista[0].hora })
      : params());
    return;
  }
  const texto = construirICS(lista);
  // En una pagina publicada las descargas van por la capacidad "downloads";
  // en un fichero suelto o en un hosting normal, basta con un blob.
  try {
    const descargas = window.claude?.use ? await window.claude.use("downloads") : null;
    if (descargas) { await descargas.save({ filename: nombre, data: texto }); return; }
  } catch (e) { /* el visor pudo rechazarla: se prueba el blob */ }
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([texto], { type: "text/calendar" }));
    a.download = nombre; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (e) {
    alert("No se pudo descargar el calendario desde esta pagina.");
  }
}

/* --------------------------------- controles -------------------------------- */

/* --------------- alto de la cabecera, para el titulo pegajoso --------------- */

// Cambia al plegar filtros, al rotar el movil o al aparecer las etiquetas, asi
// que se observa en vez de medirlo una sola vez.
const cabecera = document.querySelector("header");
const medirCabecera = () =>
  document.documentElement.style.setProperty(
    "--alto-cabecera", Math.round(cabecera.getBoundingClientRect().height) + "px");
medirCabecera();
if (window.ResizeObserver) new ResizeObserver(medirCabecera).observe(cabecera);
else addEventListener("resize", medirCabecera);

/* ------------------------- panel de filtros plegable ------------------------ */

const panelFiltros = $("#panel-filtros"), botonFiltros = $("#alternar-filtros");
const estrecho = () => matchMedia("(max-width:720px)").matches;

function plegar(abierto) {
  panelFiltros.hidden = !abierto;
  botonFiltros.setAttribute("aria-expanded", String(abierto));
}

function contarFiltrosActivos() {
  const f = estadoFiltros();
  return f.actividad.length + f.sala.length + f.monitor.length +
         (f.q ? 1 : 0) + (f.h1 || f.h2 ? 1 : 0);
}

function marcarInsignia() {
  const n = contarFiltrosActivos(), insignia = $("#n-filtros");
  insignia.hidden = n === 0;
  insignia.textContent = n;
}

// Plegado por defecto solo donde estorba; si ya lo abrio o cerro, se respeta.
const guardado = recordar.leer("filtros-abiertos");
plegar(guardado === null ? !estrecho() : guardado === "1");
botonFiltros.onclick = () => {
  const abrir = panelFiltros.hidden;
  plegar(abrir);
  recordar.guardar("filtros-abiertos", abrir ? "1" : "0");
};

/* ---------------------------------- tema ------------------------------------ */

// Tres estados: seguir al navegador, claro fijo u oscuro fijo.
const TEMAS = [
  { valor: null,      icono: "\u25D0", texto: "Tema: el del navegador" },
  { valor: "claro",   icono: "\u2600", texto: "Tema: claro" },
  { valor: "oscuro",  icono: "\u263E", texto: "Tema: oscuro" },
];

function aplicarTema(valor) {
  const t = TEMAS.find(x => x.valor === valor) || TEMAS[0];
  if (t.valor) document.documentElement.setAttribute("data-tema", t.valor);
  else document.documentElement.removeAttribute("data-tema");
  const boton = $("#tema");
  boton.textContent = t.icono;
  boton.title = t.texto + " (pulsa para cambiar)";
  boton.setAttribute("aria-label", t.texto);
  return t;
}

let temaActual = aplicarTema(recordar.leer("tema"));
$("#tema").onclick = () => {
  const siguiente = TEMAS[(TEMAS.indexOf(temaActual) + 1) % TEMAS.length];
  temaActual = aplicarTema(siguiente.valor);
  if (siguiente.valor) recordar.guardar("tema", siguiente.valor);
  else { try { localStorage.removeItem("agora:tema"); } catch (e) {} }
};

function mover(dias) {
  const d = new Date(($("#desde").value || hoyISO()) + "T00:00:00");
  d.setDate(d.getDate() + dias);
  $("#desde").value = iso(d); diaActivo = null; cargar();
}

let debounce;
const reprogramar = () => {
  marcarInsignia();
  clearTimeout(debounce); debounce = setTimeout(() => cargar(), FUENTE ? 90 : 260);
};

$("#desde").value = hoyISO();
$("#desde").onchange = () => { diaActivo = null; cargar(); };
$("#dias").onchange = () => { diaActivo = null; cargar(); };
$("#anterior").onclick = () => mover(-Number($("#dias").value));
$("#siguiente").onclick = () => mover(+Number($("#dias").value));
$("#hoy").onclick = () => { $("#desde").value = hoyISO(); diaActivo = null; cargar(); };
$("#refrescar").onclick = () => cargar(true);
$("#ics").onclick = () => exportarICS(clases);
$("#q").oninput = reprogramar;
["h1","h2","proximas"].forEach(id => $("#" + id).onchange = () => { marcarInsignia(); cargar(); });
Object.values(MULTIS).forEach(m => m.alCambiar(() => { pintarChips(); cargar(); }));
$("#limpiar").onclick = () => {
  ["q","h1","h2"].forEach(id => $("#" + id).value = "");
  Object.values(MULTIS).forEach(m => m.limpiar());
  pintarChips();
  $("#proximas").checked = true; diaActivo = null; cargar();
};
$("#cerrar").onclick = cerrar;
$("#velo").onclick = cerrar;
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    const abiertos = document.querySelectorAll(".multi.abierto");
    if (abiertos.length) abiertos.forEach(cerrarMulti); else cerrar();
  }
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
});

// Ajustes propios de la instantanea: sin descarga en vivo y con rango acotado.
if (FUENTE) {
  $("#refrescar").hidden = true;
  $("#subtitulo").textContent = `We Granada · datos del ${FUENTE.generado}`;
  if (FUENTE.rango) {
    $("#desde").min = FUENTE.rango[0];
    $("#desde").max = FUENTE.rango[1];
    if (hoyISO() < FUENTE.rango[0]) $("#desde").value = FUENTE.rango[0];
    if (hoyISO() > FUENTE.rango[1]) $("#desde").value = FUENTE.rango[1];
  }
}

cargar();
</script>
